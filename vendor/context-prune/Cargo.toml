[package]
edition = "2021"
rust-version = "1.80"
name = "context-prune"
version = "0.4.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Token compression proxy for coding agents — sits between your agent and the LLM API, prunes redundant context, tracks token savings"
readme = "README.md"
keywords = [
    "llm",
    "tokens",
    "compression",
    "proxy",
    "agents",
]
categories = [
    "command-line-utilities",
    "development-tools",
]
license = "MIT"
repository = "https://github.com/fuleinist/context-prune"

# Library target added by the kcode fork (upstream is bin-only).
[lib]
name = "context_prune"
path = "src/lib.rs"

[features]
default = ["skeleton"]
skeleton = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
]

[dependencies.anyhow]
version = "1"

# kcode fork note: rusqlite is 0.41 (workspace-pinned in kcode-base) rather than
# upstream's 0.32. Two `libsqlite3-sys` versions cannot coexist in one link graph
# ("only one package in the dependency graph may specify the same links value"),
# and kcode-base already links 0.39 via rusqlite 0.41. The API surface
# `cache.rs` uses (Connection::open/execute_batch/execute/prepare/query,
# Rows::next, Row::get, params!) is unchanged across those versions.
[dependencies.rusqlite]
version = "0.41"
features = ["bundled"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.sha2]
version = "0.10"

[dependencies.tree-sitter]
version = "0.25"
optional = true

[dependencies.tree-sitter-rust]
version = "0.24"
optional = true

[profile.release]
lto = "thin"
