[package]
name = "kcode-todo-policy"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pure todo quality-gate and auto-poke policy shared by Jcode clients"

[dependencies]
kcode-task-types = { path = "../kcode-task-types" }
kcode-storage = { path = "../kcode-storage" }
kcode-logging = { path = "../kcode-logging" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
kcode-core = { path = "../kcode-core" }
