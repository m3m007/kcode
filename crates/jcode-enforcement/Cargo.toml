[package]
name = "jcode-enforcement"
version = "0.1.0"
edition = "2024"
autobins = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync", "time"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
streaming-iterator = "0.1"
cargo_metadata = "0.19"

[dev-dependencies]
tempfile = "3"
